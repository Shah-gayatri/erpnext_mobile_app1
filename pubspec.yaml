name: frappe_hr_webview
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.16.0
  permission_handler: ^11.3.1
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # 🔥 ADDED FOR ICON + SPLASH
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:

  uses-material-design: true

  assets:
    - assets/icon/
    - assets/splash/

# ---------------------------
# APP ICON CONFIG
# ---------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"


# ---------------------------
# SPLASH SCREEN CONFIG (blank white — no icon flash)
# ---------------------------
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash/transparent.png

  android: true
  ios: true

  android_12:
    image: assets/splash/transparent.png
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"